name: 🎪 Showtime Cleanup

# Scheduled cleanup of expired environments
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

  # Manual trigger for testing
  workflow_dispatch:

# Common environment variables (non-sensitive only; credentials are scoped
# to the step that runs showtime so the install step never sees them)
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  GITHUB_ORG: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}

permissions:
  contents: read

jobs:
  cleanup-expired:
    name: Clean up expired showtime environments
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write        # delete orphaned showtime label definitions (label CRUD is the issues API)
      pull-requests: write

    steps:
      - name: Install Superset Showtime
        run: pip install "superset-showtime==${SHOWTIME_VERSION}"
        env:
          # Pinned exactly: this package runs with the AWS and GitHub
          # credentials below, so a floating install would hand those secrets
          # to any compromised release.
          SHOWTIME_VERSION: "0.7.1"

      - name: Cleanup expired environments and orphaned labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Cleaning up environments respecting TTL labels, and pruning orphaned 🎪 labels"
          python -m showtime cleanup --respect-ttl --force
